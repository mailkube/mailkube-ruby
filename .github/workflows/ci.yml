name: CI

on:
  push:
    # `develop` only, and `main` is absent on purpose. `develop` is the integration branch and is
    # pushed to directly, so without this trigger a direct push would run nothing — `pull_request`
    # alone does not cover it. `main` is covered instead by release.yml, which runs this whole
    # workflow through `workflow_call` as its `ci-gate` job before releasing. Adding `main` here
    # would put that gate run and a standalone push run in the same `ci-${{ github.ref }}`
    # concurrency group, where one is cancelled — and the cancelled one is what the README's CI
    # badge reports.
    branches: [develop]
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The floor, and the only place the gates run. Every dev gem is pinned exactly, so running
    # them on a second Ruby would test the tooling's compatibility rather than this gem's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Lint (rubocop — complexity, docs, style)
        run: bundle exec rubocop

      - name: Signatures are coherent (rbs validate)
        run: bundle exec rbs -r uri -r time -r openssl -r json -r net-http -r socket -r erb -I sig validate

      - name: Implementation matches the signatures (steep check)
        run: bundle exec steep check

      - name: Specs + coverage (line and branch, 90%)
        run: bundle exec rspec

      # Publish-readiness, on every PR rather than for the first time in the release runner.
      # `gem build` is the only thing that validates the gemspec end to end: a metadata key
      # RubyGems rejects, a `spec.files` glob that matches nothing, or a `require_relative` that
      # cannot resolve are all build-time failures. `publishCmd` already runs this, but it runs it
      # *after* semantic-release has pushed the tag, so a gemspec defect there leaves a tag with no
      # gem behind it. `--strict` promotes the warnings (a missing summary, a bad licence
      # identifier) to failures.
      - name: Gem is publishable (gem build --strict)
        run: gem build --strict mailkube.gemspec

  forward-compat:
    # The gem must also work on the newest Ruby, and that is a different claim from "the tooling
    # works there". Only the specs run here.
    #
    # `BUNDLE_WITHOUT` keeps the *claim* clean, and it is worth stating why, because it is easy to
    # read as hygiene and drop. `bundler-cache: true` runs a full `bundle install` before any step
    # here, and `Gemfile.lock` is gitignored so it resolves fresh every run. Without this, that
    # install also builds `rubocop`, `rbs` and `steep` — pinned to exact versions, and pinned for
    # the floor. A dev gem that failed to install on the newest Ruby would then turn this job red
    # while saying nothing about the library, which is the one thing the job exists to test.
    #
    # It is a scoping choice, not a workaround: as of Ruby 4.0.6 the whole development group does
    # install and `bundle exec rake` passes there. An earlier revision of this comment claimed
    # `strscan` could not compile against Ruby 4.0 headers; that was a local toolchain artefact,
    # written up in CONTRIBUTING.md under "check your compiler's target".
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Specs on the newest Ruby
        run: bundle exec rspec

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .

  docs:
    # Governance gate: every .rules/*.md must be indexed in AGENTS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh

name: Release

# Conventional-Commits-driven release: one tag + one GitHub Release, then a push to RubyGems
# over OIDC trusted publishing. No long-lived API key is stored anywhere.
#
# NOTHING is committed back to `main`. See .rules/RELEASE.md.
#
# ─── INERT UNTIL 1.0.0 IS READY TO CUT ────────────────────────────────────────────────────────
# The `push: branches: [main]` trigger is commented out on purpose. Until the gem name is claimed
# by a *pending* trusted publisher on rubygems.org, every push to `main` would fire a release that
# gets as far as `gem push` and then fails — and semantic-release pushes the tag *before* the
# publish plugins run, so the failed run leaves a `vX.Y.Z` tag behind with no GitHub Release. The
# Releases page is this repo's changelog, so that entry would be lost permanently.
#
# To arm it, once CI is green on `main` and the pending trusted publisher is registered
# (org + repo + `release.yml` + the `release` environment): delete `workflow_dispatch` below,
# restore the two `push` lines, and push. That push cuts 1.0.0 over OIDC.
#
# One companion edit is required at the same time: delete the `push: branches: [main]` trigger from
# ci.yml. While this workflow is inert, that trigger is the only thing testing `main`; the moment it
# is armed, ci-gate below runs the same workflow through `workflow_call` and the two collide in the
# shared `ci-${{ github.ref }}` concurrency group, cancelling one run and reddening the CI badge.
# Every other SDK has already dropped that trigger for exactly this reason.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    # Release only proceeds if the full gated CI (test + dry + docs) is green.
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: release
    # A job-level `permissions:` block REPLACES the defaults rather than adding to them, so every
    # scope semantic-release needs has to be listed. `@semantic-release/github` runs with its
    # defaults on: after the tag is pushed it comments on the resolved PRs and issues
    # (successComment) and adds the `released` label. Without the last two scopes that 403s, and it
    # 403s *after* the tag exists and the gem is pushed — a red run on a release that shipped.
    permissions:
      contents: write # push the tag, create the GitHub Release
      id-token: write # OIDC token for RubyGems trusted publishing
      issues: write # @semantic-release/github comments on resolved issues
      pull-requests: write # ...and on resolved PRs, and applies the `released` label
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Deliberately NOT `rubygems/release-gem`. That action runs `bundle exec rake release`,
      # which refuses a dirty working tree and creates its own git tag — and here the tree is
      # dirty on purpose and the tag already exists. This step is the OIDC half of what that
      # action does; the gem build and push are semantic-release's `publishCmd`.
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      # One step does everything, and only when the commits actually warrant a release:
      # `prepareCmd` writes version.rb in THIS runner's working copy (never committed —
      # `@semantic-release/git` is deliberately absent), `publishCmd` builds and pushes the gem,
      # and the tag plus GitHub Release come from semantic-release itself. Publishing from
      # `publishCmd` rather than a following workflow step is what keeps a non-releasing push to
      # `main` from trying to push the `0.0.0` placeholder. See .rules/RELEASE.md.
      - name: Release (semantic-release — tag, GitHub Release, gem push)
        run: >-
          npx --yes
          -p semantic-release
          -p @semantic-release/exec
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
